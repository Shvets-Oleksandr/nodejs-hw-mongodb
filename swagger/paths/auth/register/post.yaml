tags:
  - Auth
summary: Register user
operationId: addUser
description: 'Register a user with payload'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'John Doe'
          email:
            description: "User's email"
            type: string
            example: 'user@example.com'
          password:
            description: "User's password"
            type: string
            format: password
            example: strongPassword123
responses:
  '201':
    description: Successfully registered a user!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              required:
                - name
                - email
                - _id
              properties:
                name:
                  description: "User's name"
                  type: string
                  example: 'Ben Foster'
                email:
                  description: "User's email"
                  type: string
                  example: 'user@example.com'
                _id:
                  description: "User's id"
                  type: string
                  example: 65e4decdd286b30065d54af9
  '400':
    $ref: ../../../components/responses/400.yaml
  '409':
    description: Email in use error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 409
            message:
              type: string
              example: 'Something went wrong'
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Email in use'
