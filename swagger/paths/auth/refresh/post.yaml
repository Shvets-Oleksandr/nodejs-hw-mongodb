tags:
  - Auth
summary: Refresh access token
operationId: refreshToken
description: 'Obtain a new access token using a refresh token sent via cookies.'
security:
  - cookieAuth: []
  - sessionIdAuth: []
responses:
  '200':
    description: Successfully refreshed a session!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  description: "User's access token"
                  type: string
                  example: 'nhjVe18Rmsk6uoqFTsSqeyLjAppcIbhvO4ooYyuS'
  '401':
    $ref: ../../../components/responses/401.yaml
