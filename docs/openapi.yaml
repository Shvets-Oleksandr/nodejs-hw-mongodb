openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts app
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: This is a documentation of contscts app
tags:
  - name: Contacts
    description: Operations about contacts.
  - name: Auth
    description: Auth operations.
servers:
  - url: http://localhost:3000
  - url: https://contacts-app-l103.onrender.com
paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/{contactId}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{contactId}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{contactId}/delete.yaml
  /auht/register:
    post:
      $ref: ../swagger/paths/auth/register/post.yaml
  /auht/login:
    post:
      $ref: ../swagger/paths/auth/login/post.yaml
  /auht/refresh:
    post:
      $ref: ../swagger/paths/auth/refresh/post.yaml
  /auht/logout:
    post:
      $ref: ../swagger/paths/auth/logout/post.yaml
  /auht/send-reset-email:
    post:
      $ref: ../swagger/paths/auth/send-reset-email/post.yaml
  /auht/reset-pwd:
    post:
      $ref: ../swagger/paths/auth/reset-password/post.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
    sessionIdAuth:
      type: apiKey
      in: cookie
      name: sessionId
